<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="勾配電卓">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1f2733">
<title>勾配伸び率電卓</title>
<style>
  :root{
    --bg:#0f141b; --panel:#1f2733; --panel2:#262f3d; --line:#333f52;
    --txt:#f2f5f9; --sub:#93a1b5; --accent:#ff9500; --key:#2c3746; --key-lite:#3a4658;
    --ok:#2fbf71; --danger:#e2574c; --blue:#3a86ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;}
  .app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;padding:10px 12px 0;touch-action:manipulation;}
  header{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 8px;flex-shrink:0;}
  header h1{font-size:16px;margin:0;font-weight:700;display:flex;align-items:center;gap:6px;}
  .back-link{color:var(--sub);text-decoration:none;font-size:20px;font-weight:700;margin-right:2px;padding:2px 4px;}
  header h1 .logo{background:var(--blue);color:#08182e;border-radius:7px;width:24px;height:24px;display:grid;place-items:center;font-size:13px;font-weight:800;}

  .calc-zone{flex-shrink:0;}
  .display{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:7px;box-shadow:0 4px 14px rgba(0,0,0,.22);}
  .expr{min-height:18px;font-size:14px;color:var(--sub);text-align:right;white-space:nowrap;overflow-x:auto;}
  .expr::-webkit-scrollbar{display:none;}
  .result{text-align:right;font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.15;white-space:nowrap;overflow-x:auto;color:var(--txt);}
  .result::-webkit-scrollbar{display:none;}

  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
  button.key{border:none;border-radius:13px;height:46px;font-size:18px;font-weight:600;color:var(--txt);background:var(--key);cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation;box-shadow:0 2px 0 rgba(0,0,0,.18);transition:filter .08s,transform .05s;}
  button.key:active{filter:brightness(1.25);transform:scale(.95) translateY(1px);}
  .key.fn{background:var(--key-lite);font-size:14px;color:#c9d3e0;}
  .key.op{background:#2a2416;color:var(--accent);font-size:20px;font-weight:700;}
  .key.eq{background:var(--accent);color:#1a1005;font-weight:800;}
  .key.wide{grid-column:span 2;}

  .grad-btn{width:100%;margin-top:7px;background:linear-gradient(90deg,#1f3a5c,#274a73);border:1px solid #345f8f;color:#bcd7ff;border-radius:13px;height:48px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 2px 0 rgba(0,0,0,.18);}
  .grad-btn:active{filter:brightness(1.2);}

  .result-panel{margin-top:8px;background:var(--panel);border:1px solid var(--blue);border-radius:14px;padding:12px 14px;display:none;}
  .result-panel.show{display:block;}
  .result-panel .meta{font-size:11px;color:var(--sub);margin-bottom:8px;}
  .result-row2{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line);}
  .result-row2:first-of-type{border-top:none;}
  .result-row2 .lbl{font-size:13px;color:var(--sub);}
  .result-row2 .num{font-size:19px;font-weight:700;color:var(--txt);}
  .save-all{width:100%;margin-top:8px;background:var(--ok);color:#08331d;border:none;border-radius:11px;height:42px;font-size:14px;font-weight:700;cursor:pointer;}
  .save-all:active{filter:brightness(1.2);}

  .hist-zone{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:10px;border-top:1px solid var(--line);padding-top:9px;}
  .hist-head{display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px;flex-shrink:0;}
  .hist-head h2{font-size:12px;margin:0;color:var(--sub);font-weight:700;letter-spacing:.5px;}
  .hist-head button{background:var(--panel2);border:1px solid var(--line);color:var(--sub);border-radius:9px;font-size:12px;padding:6px 10px;cursor:pointer;}
  .hist-scroll{flex:1;min-height:0;overflow-y:auto;padding-bottom:20px;}
  .hist-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
  .hist-item{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px 13px;box-shadow:0 2px 8px rgba(0,0,0,.16);}
  .hist-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .hist-pitch{font-size:12px;color:var(--blue);font-weight:700;background:#152438;border-radius:7px;padding:3px 8px;}
  .hist-mode{font-size:11px;color:var(--sub);}
  .btn-del{background:var(--panel2);color:var(--danger);border:1px solid var(--line);border-radius:8px;font-size:11px;padding:5px 9px;cursor:pointer;}
  .hist-vals{display:flex;gap:14px;}
  .hist-vals div{flex:1;}
  .hist-vals .lbl{font-size:10px;color:var(--sub);}
  .hist-vals .num{font-size:17px;font-weight:700;color:var(--txt);}
  .empty{color:var(--sub);text-align:center;font-size:13px;padding:24px 10px;opacity:.75;line-height:1.7;}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:30;}
  .overlay.show{display:flex;}
  .sheet{width:100%;max-width:440px;background:var(--panel);border-radius:18px 18px 0 0;padding:16px 14px 22px;max-height:80vh;overflow-y:auto;}
  .sheet h3{margin:0 0 12px;font-size:15px;color:var(--txt);text-align:center;}
  .pitch-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px;}
  .pitch-grid button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px 0;font-size:14px;font-weight:600;cursor:pointer;}
  .pitch-grid button:active{filter:brightness(1.3);}
  .mode-btn{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:16px;font-size:15px;font-weight:700;margin-bottom:10px;cursor:pointer;text-align:left;}
  .mode-btn small{display:block;color:var(--sub);font-weight:400;font-size:12px;margin-top:3px;}
  .mode-btn:active{filter:brightness(1.3);}
  .sheet .cancel{width:100%;background:none;border:none;color:var(--sub);padding:10px;font-size:13px;cursor:pointer;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ok);color:#08331d;padding:10px 18px;border-radius:20px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><a href="portal.html" class="back-link">←</a><span class="logo">勾</span>勾配伸び率電卓</h1>
  </header>

  <div class="calc-zone">
    <div class="display">
      <div class="expr" id="expr"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="keys">
      <button class="key fn" data-act="clear">AC</button>
      <button class="key fn" data-act="back">⌫</button>
      <button class="key fn" data-act="pct">％</button>
      <button class="key op" data-op="÷">÷</button>
      <button class="key" data-num="7">7</button>
      <button class="key" data-num="8">8</button>
      <button class="key" data-num="9">9</button>
      <button class="key op" data-op="×">×</button>
      <button class="key" data-num="4">4</button>
      <button class="key" data-num="5">5</button>
      <button class="key" data-num="6">6</button>
      <button class="key op" data-op="−">−</button>
      <button class="key" data-num="1">1</button>
      <button class="key" data-num="2">2</button>
      <button class="key" data-num="3">3</button>
      <button class="key op" data-op="＋">＋</button>
      <button class="key wide" data-num="0">0</button>
      <button class="key" data-num=".">.</button>
      <button class="key eq" data-act="eq">＝</button>
    </div>
    <button class="grad-btn" id="btnGrad">📐 勾配伸び率で変換する</button>

    <div class="result-panel" id="resultPanel">
      <div class="meta" id="resultMeta"></div>
      <div class="result-row2"><span class="lbl">流れ</span><span class="num" id="valNagare">0</span></div>
      <div class="result-row2"><span class="lbl">隅棟</span><span class="num" id="valSumi">0</span></div>
      <button class="save-all" id="btnSaveGrad">💾 この結果を保存</button>
    </div>
  </div>

  <div class="hist-zone">
    <div class="hist-head">
      <h2>保存した結果</h2>
      <button id="btnClear">全消去</button>
    </div>
    <div class="hist-scroll">
      <ul class="hist-list" id="histList"></ul>
      <div class="empty" id="emptyMsg">計算して「📐 勾配伸び率で変換する」→ 保存すると、ここに溜まります。</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="overlay" id="pitchOverlay"><div class="sheet" id="pitchSheet"></div></div>
<div class="overlay" id="modeOverlay"><div class="sheet" id="modeSheet"></div></div>

<script>
(function(){
  "use strict";

  // ================= 計算式エンジン（デンタ君と同じ方式） =================
  var expr="";
  function tokenize(s){ return s.match(/(\d+\.?\d*|\.\d+|[+\-×÷＋−%()])/g) || []; }
  function safeEval(s){
    if(!s) return "";
    var cleaned=s.replace(/＋/g,"+").replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-")
      .replace(/(\d+\.?\d*)%/g,"($1/100)");
    if(!/^[0-9+\-*/().\s]+$/.test(cleaned)) return "";
    try{
      var v=Function('"use strict";return ('+cleaned+')')();
      if(typeof v!=="number"||!isFinite(v)) return "";
      return Math.round((v+Number.EPSILON)*1e10)/1e10;
    }catch(e){ return ""; }
  }
  function fmtNum(n){
    if(n===""||n===null||typeof n==="undefined") return "";
    if(!isFinite(n)) return "エラー";
    var neg=n<0; var s=String(Math.abs(n)); var parts=s.split(".");
    var intp=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,",");
    return (neg?"-":"")+intp+(parts.length>1?"."+parts[1]:"");
  }

  var elExpr=document.getElementById("expr"), elResult=document.getElementById("result");
  function render(){
    elExpr.textContent=tokenize(expr).join(" ");
    var r=safeEval(expr);
    if(r!==""){ elResult.textContent=fmtNum(r); return; }
    var fallback=getBaseValue();
    elResult.textContent = fallback==="" ? "0" : fmtNum(fallback);
  }
  function press(key){
    if(key==="clear"){ expr=""; render(); return; }
    if(key==="back"){ expr=expr.slice(0,-1); render(); return; }
    if(key==="pct"){ expr+="%"; render(); return; }
    if(key==="eq"||key==="eq2"){
      var r=safeEval(expr);
      if(r===""){ toast("式が不完全です"); return; }
      expr=String(r); render(); return;
    }
  }
  document.querySelector(".keys").addEventListener("click", function(e){
    var t=e.target.closest("button"); if(!t) return;
    if(t.hasAttribute("data-num")){ expr+=t.getAttribute("data-num"); render(); return; }
    if(t.hasAttribute("data-op")){ expr+=t.getAttribute("data-op"); render(); return; }
    var a=t.getAttribute("data-act"); if(a) press(a);
  });
  document.addEventListener("keydown", function(e){
    var k=e.key;
    if(k>="0"&&k<="9"){ expr+=k; render(); }
    else if(k==="."){ expr+="."; render(); }
    else if(k==="+"){ expr+="＋"; render(); }
    else if(k==="-"){ expr+="−"; render(); }
    else if(k==="*"){ expr+="×"; render(); }
    else if(k==="/"){ expr+="÷"; render(); }
    else if(k==="Enter"||k==="="){ e.preventDefault(); press("eq"); }
    else if(k==="Backspace") press("back");
    else if(k==="Escape") press("clear");
  });

  // ================= 勾配伸び率 計算 =================
  // 勾配 X寸（10寸走って X寸上がる）
  // 流れ伸び率 = √(10²+X²)/10
  // 隅棟伸び率 = √((10√2)²+X²)/(10√2)
  // 勾配 X寸（10寸走って X寸上がる）
  // 流れ伸び率（対水平）    = √(10²+X²)/10
  // 隅棟(真隅)伸び率（対水平） = √((10√2)²/2 ... 実務上は √(200+X²)/10  ※水平1に対する隅木長さの比
  // 隅棟(真隅)伸び率（対流れ） = √(200+X²) / √(100+X²)
  function nagareRate(x){ return Math.sqrt(100 + x*x) / 10; }
  function sumiRateHorizontal(x){ return Math.sqrt(200 + x*x) / 10; }
  function sumiRateNagare(x){ return Math.sqrt(200 + x*x) / Math.sqrt(100 + x*x); }

  var PITCHES=[];
  for(var p=0.5; p<=12.5+1e-9; p+=0.5) PITCHES.push(Math.round(p*10)/10);

  var lastCalc=null; // {pitch, mode, base, nagare, sumi}

  var pitchOverlay=document.getElementById("pitchOverlay"), pitchSheet=document.getElementById("pitchSheet");
  var modeOverlay=document.getElementById("modeOverlay"), modeSheet=document.getElementById("modeSheet");
  var resultPanel=document.getElementById("resultPanel"), resultMeta=document.getElementById("resultMeta");
  var valNagare=document.getElementById("valNagare"), valSumi=document.getElementById("valSumi");

  function getBaseValue(){
    var r=safeEval(expr);
    if(r!=="") return r;
    // 末尾が演算子で終わっている場合（例: "1230×"）は、それを取り除いた数値で計算する
    var trimmed=expr.replace(/[+\-×÷]+$/,"");
    return safeEval(trimmed);
  }

  document.getElementById("btnGrad").onclick=function(){
    var base=getBaseValue();
    if(base===""){ toast("先に数字を入力してください"); return; }
    openPitchSheet(base);
  };

  function openPitchSheet(base){
    pitchSheet.innerHTML="";
    var h=document.createElement("h3"); h.textContent="勾配を選択（寸）";
    pitchSheet.appendChild(h);
    var grid=document.createElement("div"); grid.className="pitch-grid";
    PITCHES.forEach(function(p){
      var b=document.createElement("button");
      b.textContent=p+"寸";
      b.onclick=function(){ pitchOverlay.classList.remove("show"); openModeSheet(base, p); };
      grid.appendChild(b);
    });
    pitchSheet.appendChild(grid);
    var cancel=document.createElement("button"); cancel.className="cancel"; cancel.textContent="キャンセル";
    cancel.onclick=function(){ pitchOverlay.classList.remove("show"); };
    pitchSheet.appendChild(cancel);
    pitchOverlay.classList.add("show");
  }

  function openModeSheet(base, pitch){
    modeSheet.innerHTML="";
    var h=document.createElement("h3"); h.textContent=pitch+"寸勾配 - 基準を選択";
    modeSheet.appendChild(h);

    function modeBtn(label, sub, fn){
      var b=document.createElement("button"); b.className="mode-btn";
      b.innerHTML=label+"<small>"+sub+"</small>";
      b.onclick=function(){ fn(); modeOverlay.classList.remove("show"); };
      modeSheet.appendChild(b);
    }
    modeBtn("水平に対して", "入力した数字を水平距離として、流れ・隅棟の長さを求める", function(){
      calcAndShow(base, pitch, "horizontal");
    });
    modeBtn("流れに対して", "入力した数字を流れ（軒先方向）の長さとして、隅棟の長さを求める", function(){
      calcAndShow(base, pitch, "nagare");
    });

    var cancel=document.createElement("button"); cancel.className="cancel"; cancel.textContent="キャンセル";
    cancel.onclick=function(){ modeOverlay.classList.remove("show"); };
    modeSheet.appendChild(cancel);
    modeOverlay.classList.add("show");
  }

  function calcAndShow(base, pitch, mode){
    var nagare, sumi;
    if(mode==="horizontal"){
      nagare = base*nagareRate(pitch);
      sumi = base*sumiRateHorizontal(pitch);
    } else {
      nagare = base;
      sumi = base*sumiRateNagare(pitch);
    }
    lastCalc = { pitch:pitch, mode:mode, base:base, nagare:nagare, sumi:sumi };
    resultMeta.textContent = pitch+"寸勾配 ／ 基準: "+(mode==="horizontal"?"水平 "+fmtNum(base):"流れ "+fmtNum(base));
    valNagare.textContent = fmtNum(nagare);
    valSumi.textContent = fmtNum(sumi);
    resultPanel.classList.add("show");
  }

  // ================= 履歴（保存） =================
  var history=[];
  var idc=1;
  var STORE_KEY="dentakun_gradient_history_v1";
  var canStore=true;
  function load(){ try{ var raw=localStorage.getItem(STORE_KEY); if(raw) history=JSON.parse(raw)||[]; }catch(e){ canStore=false; } }
  function persist(){ if(!canStore) return; try{ localStorage.setItem(STORE_KEY, JSON.stringify(history)); }catch(e){ canStore=false; } }

  var elList=document.getElementById("histList"), elEmpty=document.getElementById("emptyMsg");

  document.getElementById("btnSaveGrad").onclick=function(){
    if(!lastCalc){ toast("保存できません"); return; }
    history.unshift({ id:"g"+(idc++), pitch:lastCalc.pitch, mode:lastCalc.mode, base:lastCalc.base, nagare:lastCalc.nagare, sumi:lastCalc.sumi });
    if(history.length>200) history.pop();
    persist(); renderHistory();
    toast("保存しました");
  };

  function delItem(id){ history=history.filter(function(h){return h.id!==id;}); persist(); renderHistory(); }
  function clearHistory(){
    if(!history.length) return;
    if(confirm("保存した結果をすべて消去しますか？")){ history=[]; persist(); renderHistory(); }
  }

  function renderHistory(){
    elList.innerHTML="";
    if(!history.length){ elEmpty.style.display="block"; return; }
    elEmpty.style.display="none";
    history.forEach(function(item){
      var li=document.createElement("li"); li.className="hist-item";
      var top=document.createElement("div"); top.className="hist-top";
      var pitchTag=document.createElement("span"); pitchTag.className="hist-pitch"; pitchTag.textContent=item.pitch+"寸";
      var modeTag=document.createElement("span"); modeTag.className="hist-mode";
      modeTag.textContent = "基準: "+(item.mode==="horizontal"?"水平":"流れ")+" "+fmtNum(item.base);
      var dl=document.createElement("button"); dl.className="btn-del"; dl.textContent="削除";
      dl.onclick=function(){ delItem(item.id); };
      var left=document.createElement("div"); left.style.cssText="display:flex;gap:8px;align-items:center;flex:1;min-width:0;";
      left.appendChild(pitchTag); left.appendChild(modeTag);
      top.appendChild(left); top.appendChild(dl);

      var vals=document.createElement("div"); vals.className="hist-vals";
      var vN=document.createElement("div"); vN.innerHTML='<div class="lbl">流れ</div><div class="num">'+fmtNum(item.nagare)+'</div>';
      var vS=document.createElement("div"); vS.innerHTML='<div class="lbl">隅棟</div><div class="num">'+fmtNum(item.sumi)+'</div>';
      vals.appendChild(vN); vals.appendChild(vS);

      li.appendChild(top); li.appendChild(vals);
      elList.appendChild(li);
    });
  }

  document.getElementById("btnClear").onclick=clearHistory;
  pitchOverlay.addEventListener("click", function(e){ if(e.target===pitchOverlay) pitchOverlay.classList.remove("show"); });
  modeOverlay.addEventListener("click", function(e){ if(e.target===modeOverlay) modeOverlay.classList.remove("show"); });

  var toastEl=document.getElementById("toast"), toastT;
  function toast(msg){ toastEl.textContent=msg; toastEl.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){toastEl.classList.remove("show");},1400); }

  load();
  renderHistory();
  render();

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
