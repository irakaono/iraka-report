<style>
:root{--blue:#1f4e79;--bg:#eef3f8;--text:#222}
*{box-sizing:border-box}
body{margin:0;font-family:"Meiryo","Yu Gothic",system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,#123a5f,#0d6efd);color:#fff;text-align:center;padding:26px 16px 28px;font-size:34px;font-weight:800;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.wrap{max-width:760px;margin:24px auto;padding:0 14px 36px}
.card{display:block;background:#fff;border-radius:18px;padding:28px 18px;margin:18px 0;text-decoration:none;color:#222;text-align:center;font-size:28px;font-weight:800;box-shadow:0 4px 16px rgba(0,0,0,.12);border:1px solid rgba(31,78,121,.08)}
.card:active{transform:scale(.99)}
.icon{font-size:34px;display:block;margin-bottom:8px}
.disabled{opacity:.45;pointer-events:none}
.note{text-align:center;color:#777;font-size:14px;margin-top:30px}
.badge{display:inline-block;background:#fff;color:#1f4e79;border-radius:999px;padding:5px 12px;font-size:13px;margin-top:10px;font-weight:700}
