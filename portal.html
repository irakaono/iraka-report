<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>甍AI Field</title>
<meta name="theme-color" content="#1f4e79">
<meta name="description" content="株式会社甍の現場業務アプリ">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="甍AI Field">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{box-sizing:border-box}
body{margin:0;background:#EEF3F8;font-family:Meiryo,"Yu Gothic",sans-serif;color:#222}
header{
  background:linear-gradient(135deg,#1F4E79,#2E74B5);
  color:#fff;text-align:center;
  padding:28px 14px 30px;
  box-shadow:0 2px 12px rgba(0,0,0,.2);
}
.logo{width:64px;height:64px;border-radius:16px;vertical-align:middle;margin-right:10px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.app-name{font-size:28px;font-weight:800;vertical-align:middle;}
.badge{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:4px 14px;font-size:12px;margin-top:10px;font-weight:600}
.wrap{max-width:520px;margin:0 auto;padding:24px 16px 48px}

/* ===== アクティブカード ===== */
.card{
  display:flex;align-items:center;gap:16px;
  background:#fff;border-radius:16px;
  padding:22px 20px;margin:0 0 14px;
  text-decoration:none;color:#1F4E79;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  border:2px solid transparent;
  transition:all .15s;
  -webkit-tap-highlight-color:transparent;
}
.card:active{transform:scale(.98);border-color:#2E74B5;background:#EEF6FF;}
.card-icon{font-size:32px;flex-shrink:0;width:48px;text-align:center;}
.card-body{}
.card-title{font-size:17px;font-weight:800;line-height:1.3;}
.card-desc{font-size:12px;color:#666;margin-top:3px;}

/* ===== Coming Soon セクション ===== */
.coming-section{margin-top:28px;}
.coming-label{
  font-size:11px;font-weight:bold;color:#999;
  letter-spacing:.1em;text-transform:uppercase;
  padding:0 4px 8px;border-bottom:1px solid #ddd;
  margin-bottom:14px;
}
.card-disabled{
  display:flex;align-items:center;gap:16px;
  background:#F8FAFD;border-radius:14px;
  padding:16px 18px;margin:0 0 10px;
  opacity:.5;pointer-events:none;
  border:1.5px dashed #BDD7EE;
}
.card-disabled .card-icon{font-size:26px;width:40px;text-align:center;}
.card-disabled .card-title{font-size:15px;font-weight:700;color:#555;}
.card-disabled .card-desc{font-size:11px;color:#888;}

.footer{text-align:center;color:#AAA;font-size:11px;margin-top:32px;}
</style>
</head>
<body>
<header>
  <img class="logo" src="./icon-192.png" alt="甍">
  <span class="app-name">甍AI Field</span>
  <div class="badge">株式会社 甍（いらか）</div>
</header>

<main class="wrap">

  <!-- ===== Ver.1 アクティブ ===== -->
  <a class="card" href="./index.html">
    <div class="card-icon">☔</div>
    <div class="card-body">
      <div class="card-title">雨漏り調査報告書</div>
      <div class="card-desc">現地調査・点検・診断レポート</div>
    </div>
  </a>

  <a class="card" href="./completion.html">
    <div class="card-icon">🛠️</div>
    <div class="card-body">
      <div class="card-title">工事完了報告書</div>
      <div class="card-desc">施工記録・完了報告・写真付き</div>
    </div>
  </a>

  <a class="card" href="./estimation.html">
    <div class="card-icon">📐</div>
    <div class="card-body">
      <div class="card-title">積算（拾いエディタ）</div>
      <div class="card-desc">図面から数量拾い・勾配伸び率・エクスポート</div>
    </div>
  </a>

  <a class="card" href="./keisan.html">
    <div class="card-icon">🧮</div>
    <div class="card-body">
      <div class="card-title">勾配電卓</div>
      <div class="card-desc">テンキー＋勾配伸び率で流れ・隅棟長さ、履歴保存</div>
    </div>
  </a>

  <!-- ===== Ver.2.0 Coming Soon ===== -->
  <div class="coming-section">
    <div class="coming-label">🚧 Ver.2.0 Coming Soon</div>

    <div class="card-disabled">
      <div class="card-icon">📁</div>
      <div class="card-body">
        <div class="card-title">案件管理</div>
        <div class="card-desc">調査〜完了を案件単位で管理</div>
      </div>
    </div>

    <div class="card-disabled">
      <div class="card-icon">🤖</div>
      <div class="card-body">
        <div class="card-title">AI所見生成</div>
        <div class="card-desc">甍ノウハウを活かした所見を自動作成</div>
      </div>
    </div>

    <div class="card-disabled">
      <div class="card-icon">📊</div>
      <div class="card-body">
        <div class="card-title">Excel出力</div>
        <div class="card-desc">案件データを集計・見積連携</div>
      </div>
    </div>
  </div>

  <div class="footer">
    甍AI Field — 株式会社 甍<br>
    <span id="versionLabel" onclick="checkUpdate()" style="cursor:pointer;text-decoration:underline;color:#BBD;">
      Version 1.1.0 (20260713)
    </span>
  </div>
</main>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').then(reg=>{
      // 更新チェック
      reg.update();
      // controllerchangeで確実にリロード
      navigator.serviceWorker.addEventListener('controllerchange', ()=>{
        location.reload();
      });

      reg.addEventListener('updatefound', ()=>{
        const newSW = reg.installing;
        newSW.addEventListener('statechange', ()=>{
          if(newSW.state === 'installed' && navigator.serviceWorker.controller){
            if(confirm('新しいバージョンがあります。更新しますか？')){
              newSW.postMessage({type:'SKIP_WAITING'});
              // controllerchangeイベントでreloadされる
            }
          }
        });
      });
    }).catch(()=>{});
  });
}

function checkUpdate(){
  if(!('serviceWorker' in navigator)){ alert('ServiceWorker非対応のブラウザです。'); return; }
  navigator.serviceWorker.getRegistration('./sw.js').then(reg=>{
    if(!reg){ alert('ServiceWorkerが登録されていません。'); return; }
    reg.update().then(()=>{
      alert('Version 1.1.0 (20260713)\n\n更新を確認しました。\n最新版が反映されています。');
    });
  });
}
</script>
</body>
</html>
